<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cuentas-claras</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="app" class="container py-5" x-data="expensesApp()">
      <header class="mb-4">
        <h1 class="display-5 fw-semibold">Cuentas Claras</h1>
        <p class="text-secondary mb-0">Manage shared expenses with friends</p>
      </header>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h4 mb-3">Members</h2>
          <form class="row g-3 align-items-end" @submit.prevent="addMember">
            <div class="col-md-8">
              <label class="form-label">
                Name
                <input
                  type="text"
                  class="form-control"
                  x-model="memberName"
                  placeholder="Add a member"
                />
              </label>
            </div>
            <div class="col-md-4 d-grid">
              <button type="submit" class="btn btn-primary">Add Member</button>
            </div>
          </form>
          <div class="mt-3">
            <p class="text-secondary" x-show="members.length === 0">No members yet.</p>
            <ul class="list-group" x-show="members.length > 0">
              <template x-for="member in members" :key="member">
                <li class="list-group-item" x-text="member"></li>
              </template>
            </ul>
          </div>
        </div>
      </section>

      <section class="card shadow-sm mb-4">
        <div class="card-body">
          <h2 class="h4 mb-3">Expenses</h2>
          <form class="row g-3 align-items-end" @submit.prevent="addExpense">
            <div class="col-lg-5">
              <label class="form-label">
                Description
                <input
                  type="text"
                  class="form-control"
                  x-model="expenseDescription"
                  placeholder="Dinner, taxi, tickets"
                />
              </label>
            </div>
            <div class="col-lg-3">
              <label class="form-label">
                Amount
                <input
                  type="number"
                  class="form-control"
                  min="0"
                  step="0.01"
                  x-model="expenseAmount"
                />
              </label>
            </div>
            <div class="col-lg-4">
              <label class="form-label">
                Paid by
                <select class="form-select" x-model="expensePaidBy">
                  <option value="" disabled>Select a member</option>
                  <template x-for="member in members" :key="member">
                    <option :value="member" x-text="member"></option>
                  </template>
                </select>
              </label>
            </div>
            <div class="col-12 d-grid d-md-flex justify-content-end">
              <button
                type="submit"
                class="btn btn-success"
                :disabled="members.length === 0"
              >
                Add Expense
              </button>
            </div>
          </form>
          <div class="mt-3">
            <p class="text-secondary" x-show="expenses.length === 0">No expenses yet.</p>
            <ul class="list-group" x-show="expenses.length > 0">
              <template x-for="(expense, index) in expenses" :key="index">
                <li class="list-group-item d-flex justify-content-between align-items-center">
                  <span x-text="expense.description"></span>
                  <span class="badge text-bg-light">
                    $<span x-text="expense.amount.toFixed(2)"></span>
                    <span class="text-secondary">·</span>
                    <span x-text="expense.paidBy"></span>
                  </span>
                </li>
              </template>
            </ul>
          </div>
        </div>
      </section>

      <section class="card shadow-sm">
        <div class="card-body">
          <h2 class="h4 mb-3">Settlement</h2>
          <p class="text-secondary" x-show="transfers.length === 0">
            No transfers needed yet.
          </p>
          <ul class="list-group" x-show="transfers.length > 0">
            <template x-for="(transfer, index) in transfers" :key="index">
              <li class="list-group-item d-flex justify-content-between align-items-center">
                <span>
                  <strong x-text="transfer.from"></strong>
                  pays
                  <strong x-text="transfer.to"></strong>
                </span>
                <span class="badge text-bg-primary">
                  $<span x-text="transfer.amount.toFixed(2)"></span>
                </span>
              </li>
            </template>
          </ul>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
