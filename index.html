<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cuentas-claras</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/sandstone/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <div class="container py-5 d-flex flex-column gap-4" x-data="expensesApp()" x-init="init()">
    <header class="mb-4">
      <h1 class="display-4">
        Cuentas Claras
      </h1>
      <p class="text-secondary mb-0">Manejar gastos compartidos con amigos.</p>
    </header>

    <!-- Participantes -->
    <section class="card shadow-sm">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="h4 m-0">Participantes</h2>
          <button type="button" class="btn btn-sm btn-primary m-0" @click="showAddMemberForm()" x-show="!showMemberForm">
            <i class="bi bi-plus-lg"></i> Participante
          </button>
        </div>
        
        <!-- Formulario para agregar participante -->
        <div x-show="showMemberForm" x-transition>
          <form class="row g-2" @submit.prevent="addMember" @keyup.escape="cancelAddMemberForm()">
            <div class="col-12">
              <label class="form-label w-100">
                Nombre
                <input type="text" class="form-control form-control-sm" x-model="memberName" x-ref="memberInput" x-effect="showMemberForm && $nextTick(() => $refs.memberInput?.focus())"/>
              </label>
            </div>
            <div class="col-12 d-flex justify-content-end">
              <div class="d-flex gap-1">
                <button type="submit" class="btn btn-sm btn-success">
                  <i class="bi bi-check-lg"></i>
                </button>
                <button type="button" class="btn btn-sm btn-secondary" @click="cancelAddMemberForm()">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div x-show="members.length === 0" class="card-body text-secondary text-center">
        No hay participantes todavía.
      </div>

      <ul x-show="members.length > 0" class="list-group list-group-flush border-top-0">
        <template x-for="(member, index) in members" :key="member">
          <li class="list-group-item d-flex align-items-center justify-content-between gap-2">
            <template x-if="editingMemberIndex === index">
              <form class="d-flex gap-2 w-100" @submit.prevent="updateMember(index)" @keyup.escape="cancelEditMember()">
                <input type="text" class="form-control form-control-sm flex-grow-1" x-model="editingMemberName" x-init="$nextTick(() => $el.focus())"/>
                <div class="d-flex gap-1">
                  <button type="submit" class="btn btn-sm btn-success">
                    <i class="bi bi-check-lg"></i>
                  </button>
                  <button type="button" class="btn btn-sm btn-secondary" @click="cancelEditMember()">
                    <i class="bi bi-x-lg"></i>
                  </button>
                </div>
              </form>
            </template>
            <template x-if="editingMemberIndex !== index">
              <div class="d-flex gap-2 w-100 align-items-center justify-content-between">
                <span x-text="member"></span>
                <div class="d-flex gap-1 justify-content-end">
                  <button type="button" class="btn btn-sm btn-outline-secondary" @click="startEditMember(index)">
                    <i class="bi bi-pencil-fill"></i>
                  </button>
                  <button type="button" class="btn btn-sm btn-outline-danger" @click="removeMember(index)">
                    <i class="bi bi-trash2-fill"></i>
                  </button>
                </div>
              </div>
            </template>
          </li>
        </template>
      </ul>
    </section>

    <!-- Gastos -->
    <section class="card shadow-sm">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <h2 class="h4 m-0">Gastos</h2>
          <button type="button" class="btn btn-sm btn-primary m-0" @click="showAddExpenseForm()" x-show="!showExpenseForm">
            <i class="bi bi-plus-lg"></i> Gasto
          </button>
        </div>
        
        <!-- Formulario para agregar gasto -->
        <div x-show="showExpenseForm" x-transition class="mt-3">
          <form class="row g-2" @submit.prevent="addExpense" @keyup.escape="cancelAddExpenseForm()">
            <div class="col-12 col-sm-4">
              <label class="form-label w-100 m-0">
                Monto
                <input type="number" class="form-control form-control-sm" min="0" step="1" x-model="expenseAmount" x-ref="amountInput" x-effect="showExpenseForm && $nextTick(() => $refs.amountInput?.focus())"/>
              </label>
            </div>
            <div class="col-12 col-sm-4">
              <label class="form-label w-100 m-0">
                Pagado por
                <select class="form-select form-select-sm" x-model="expenseFrom">
                  <option value="" disabled>Participante</option>
                  <template x-for="member in members" :key="member">
                    <option :value="member" x-text="member"></option>
                  </template>
                </select>
              </label>
            </div>
            <div class="col-12 col-sm-4">
              <label class="form-label w-100 m-0">
                Descripción
                <input type="text" class="form-control form-control-sm" x-model="expenseDescription"/>
              </label>
            </div>
            <div class="col-12 d-flex justify-content-end">
              <div class="d-flex gap-1">
                <button type="submit" class="btn btn-sm btn-success" :disabled="members.length === 0">
                  <i class="bi bi-check-lg"></i>
                </button>
                <button type="button" class="btn btn-sm btn-secondary" @click="cancelAddExpenseForm()">
                  <i class="bi bi-x-lg"></i>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>

      <div x-show="expenses.length === 0" class="p-3 text-secondary text-center">
        No hay gastos todavía.
      </div>

      <ul x-show="expenses.length > 0" class="list-group list-group-flush border-top-0">
        <template x-for="(expense, index) in expenses" :key="index">
          <li class="list-group-item">
            <!-- Modo edición -->
            <template x-if="editingExpenseIndex === index">
              <form @submit.prevent="updateExpense(index)" class="row g-2">
                <div class="col-12 col-sm-5">
                  <label class="form-label w-100 m-0">
                    Descripción
                    <input type="text" class="form-control form-control-sm" x-model="editingExpenseData.description" placeholder="Descripción"/>
                  </label>
                </div>
                <div class="col-12 col-sm-4">
                  <label class="form-label w-100 m-0">
                    Monto
                    <input type="number" class="form-control form-control-sm" min="0" step="0.01" x-model="editingExpenseData.amount" placeholder="Monto"/>
                  </label>
                </div>
                <div class="col-12 col-sm-3">
                  <label class="form-label w-100 m-0">
                    Pagado por
                    <select class="form-select form-select-sm" x-model="editingExpenseData.from">
                      <template x-for="member in members" :key="member">
                        <option :value="member" x-text="member"></option>
                      </template>
                    </select>
                  </label>
                </div>

                <!-- Participantes en edición -->
                <div class="col-12">
                  <div class="d-flex flex-wrap gap-3 p-2 bg-light rounded">
                    <span class="">Compartir entre</span>
                    <template x-for="member in members" :key="member">
                      <div class="form-check d-flex align-items-center gap-2">
                        <input type="checkbox" class="form-check-input" :id="'member-' + index + '-' + member"
                          :checked="expense.participants.includes(member)"
                          @change="toggleParticipant(index, member)">
                        <label class="form-check-label mb-0" :for="'member-' + index + '-' + member" x-text="member"></label>
                      </div>
                    </template>
                  </div>
                </div>

                <!-- Botones de formulario -->
                <div class="col-12 d-flex justify-content-end">
                  <div class="d-flex gap-1">
                    <button type="submit" class="btn btn-sm btn-success">
                      <i class="bi bi-check-lg"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-secondary" @click="cancelEditExpense()">
                      <i class="bi bi-x-lg"></i>
                    </button>
                  </div>
                </div>
              </form>
            </template>

            <!-- Modo normal -->
            <template x-if="editingExpenseIndex !== index">
              <div class="d-flex flex-column gap-3">
                <!-- Información del gasto -->
                <div class="d-flex justify-content-between align-items-start gap-3">
                  <div class="flex-grow-1">
                    <div>
                      <span class="fw-semibold" x-text="expense.description"></span>
                      · 
                      $<span x-text="expense.amount.toFixed(2)" style="font-variant-numeric: tabular-nums;"></span>
                      · 
                      <span x-text="expense.from"></span>
                    </div>
                  </div>

                  <!-- Botones de acciones -->
                  <div class="d-flex gap-1">
                    <button type="button" class="btn btn-sm btn-outline-secondary" @click="startEditExpense(index)">
                      <i class="bi bi-pencil-fill"></i>
                    </button>
                    <button type="button" class="btn btn-sm btn-outline-danger" @click="removeExpense(index)">
                      <i class="bi bi-trash2-fill"></i>
                    </button>
                  </div>
                </div>

                <!-- Participantes -->
                <div class="d-flex flex-wrap gap-3 p-2 bg-light rounded">
                  <span class="">Compartir entre</span>
                  <template x-for="member in members" :key="member">
                    <div class="form-check d-flex align-items-center gap-2">
                      <input type="checkbox" class="form-check-input" :id="'member-' + index + '-' + member"
                        :checked="expense.participants.includes(member)"
                        @change="toggleParticipant(index, member)">
                      <label class="form-check-label mb-0" :for="'member-' + index + '-' + member" x-text="member"></label>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </li>
        </template>
      </ul>
    </section>

    <!-- Reparto -->
    <section class="card shadow-sm">
      <div class="card-header">
        <h2 class="h4 m-0">Reparto</h2>
      </div>
      <div class="card-body">
        <div x-show="transfers.length === 0" class="p-2 text-secondary text-center">
          No hay transferencias necesarias.
        </div>
        <ul class="list-group" x-show="transfers.length > 0">
          <template x-for="(transfer, index) in transfers" :key="index">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <span>
                <strong x-text="transfer.from"></strong>
                le debe a
                <strong x-text="transfer.to"></strong>
              </span>
              <span class="badge text-bg-primary">
                $<span x-text="transfer.amount.toFixed(2)"></span>
              </span>
            </li>
          </template>
        </ul>
      </div>
    </section>
  </div>
  <div class="small text-center text-secondary py-3 mt-auto">
    Cuentas Claras, por Tehuel Torres Baldi
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
